name: Release to Nuget

on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        # Full history, so the origin/main containment check below can actually resolve.
        fetch-depth: 0

    # Previously absent: the job relied on the runner happening to preinstall the right SDK.
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Verify commit exists in origin/main
      run: |
        git fetch --no-tags --prune origin +refs/heads/*:refs/remotes/origin/*
        git branch --remote --contains | grep origin/main

    - name: Set VERSION variable from tag
      run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore /p:Version=${VERSION}

    # Never publish a release that does not pass its own tests.
    - name: Test
      run: dotnet test --configuration Release --no-build

    - name: Pack
      run: dotnet pack StorageConnector/StorageConnector.csproj --configuration Release /p:Version=${VERSION} --no-build --output .

    - name: Push
      # --skip-duplicate so re-running a release job does not fail on an already-published version.
      run: dotnet nuget push "StorageConnector.${VERSION}.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Push symbols
      run: dotnet nuget push "StorageConnector.${VERSION}.snupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

name: Release to Nuget

on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # required for NuGet Trusted Publishing (OIDC)
    steps:
    # Actions are pinned to a commit SHA rather than a mutable tag, so a compromised or retagged
    # release cannot silently change what runs here.
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Full history, so the origin/main containment check below can actually resolve.
        fetch-depth: 0

    # Previously absent: the job relied on the runner happening to preinstall the right SDK.
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        dotnet-version: '10.0.x'

    - name: Verify commit exists in origin/main
      run: |
        git fetch --no-tags --prune origin +refs/heads/*:refs/remotes/origin/*
        git branch --remote --contains | grep origin/main

    - name: Set VERSION variable from tag
      run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore /p:Version=${VERSION}

    # Never publish a release that does not pass its own tests.
    - name: Test
      run: dotnet test --configuration Release --no-build

    # This also emits StorageConnector.${VERSION}.snupkg, which the push step uploads automatically.
    - name: Pack
      run: dotnet pack StorageConnector/StorageConnector.csproj --configuration Release /p:Version=${VERSION} --no-build --output .

    # Exchanges a GitHub OIDC token for an API key valid for one hour, so no long-lived NuGet
    # credential has to be stored as a repository secret.
    - name: NuGet login (OIDC -> temp API key)
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: login
      with:
        user: globalpay

    - name: Push
      # --skip-duplicate so re-running a release job does not fail on an already-published version.
      run: dotnet nuget push "StorageConnector.${VERSION}.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
